name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Trust VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" 'mkdir -p ~/bayramtaksi'
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:~/bayramtaksi/"

      - name: Build and restart container
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" \
            'cd ~/bayramtaksi && docker compose up -d --build --remove-orphans && docker image prune -f'
