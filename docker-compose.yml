services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bayramtaksi:latest
    container_name: bayramtaksi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
