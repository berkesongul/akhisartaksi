<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c21" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#d4a300" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="6" />

  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

  <!-- Taxi Sign at top center of car -->
  <g transform="translate(206, 105)">
    <rect x="0" y="0" width="100" height="34" rx="8" fill="url(#goldGrad)" filter="url(#glow)"/>
    <text x="50" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#09090b" text-anchor="middle" letter-spacing="2">TAXI</text>
    <path d="M40 34 L60 34 L56 42 L44 42 Z" fill="#ffcc00" />
  </g>

  <!-- Stylized Modern Car Front Outline -->
  <g transform="translate(116, 145)">
    <!-- Roof and windshield -->
    <path d="M60 48 L95 10 L185 10 L220 48 Z" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M72 44 L100 16 L180 16 L208 44 Z" fill="#ffcc00" fill-opacity="0.12" />

    <!-- Car Hood and Body -->
    <path d="M30 52 C30 52 50 48 140 48 C230 48 250 52 250 52 C265 54 275 66 272 82 L264 125 C262 135 252 142 240 142 L40 142 C28 142 18 135 16 125 L8 82 C5 66 15 54 30 52 Z" fill="#141418" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Headlights -->
    <path d="M30 68 L65 72 C70 73 74 77 72 82 L70 90 C68 95 62 98 56 96 L24 88 C18 86 16 80 18 75 L22 70 C24 68 27 68 30 68 Z" fill="#ffcc00" filter="url(#glow)" />
    <path d="M250 68 L215 72 C210 73 206 77 208 82 L210 90 C212 95 218 98 224 96 L256 88 C262 86 264 80 262 75 L258 70 C256 68 253 68 250 68 Z" fill="#ffcc00" filter="url(#glow)" />

    <!-- Grille center -->
    <rect x="95" y="74" width="90" height="32" rx="6" fill="#09090b" stroke="#ffcc00" stroke-width="2.5" />
    <line x1="95" y1="84" x2="185" y2="84" stroke="#ffcc00" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="95" y1="94" x2="185" y2="94" stroke="#ffcc00" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Bumper -->
    <rect x="55" y="118" width="170" height="18" rx="6" fill="#0c0c0e" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Plate -->
    <rect x="105" y="121" width="70" height="12" rx="3" fill="#ffcc00" />
    <text x="140" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="1">45 TAKSİ</text>
  </g>

  <!-- Taxi Checker Strip -->
  <g transform="translate(136, 318)">
    <rect x="0" y="0" width="20" height="12" fill="#ffcc00" rx="2" />
    <rect x="24" y="0" width="20" height="12" fill="#27272a" rx="2" />
    <rect x="48" y="0" width="20" height="12" fill="#ffcc00" rx="2" />
    <rect x="72" y="0" width="20" height="12" fill="#27272a" rx="2" />
    <rect x="96" y="0" width="20" height="12" fill="#ffcc00" rx="2" />
    <rect x="120" y="0" width="20" height="12" fill="#27272a" rx="2" />
    <rect x="144" y="0" width="20" height="12" fill="#ffcc00" rx="2" />
    <rect x="168" y="0" width="20" height="12" fill="#27272a" rx="2" />
    <rect x="192" y="0" width="20" height="12" fill="#ffcc00" rx="2" />
    <rect x="216" y="0" width="20" height="12" fill="#27272a" rx="2" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">AKHİSAR</text>
  <text x="256" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="10">TAKSİ</text>
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="4">7/24 GÜVENLİ ULAŞIM</text>
</svg>

